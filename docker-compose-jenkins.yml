
version: '3.8'
services:
  jenkins_python:
    environment:
        EMAIL_TO: ${EMAIL_TO}
        SMTP_USER: ${SMTP_USER}
        SMTP_PASSWORD: ${SMTP_PASSWORD}
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: jenkins_python
    privileged: true
    user: root
    ports:
     - 8080:8080
     - 50000:50000
    volumes:
      - ./jenkins_compose/jenkins_configuration:/var/jenkins_home
      - ./:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always

